name: Atualizar vídeos do YouTube

on:
  schedule:
    - cron: '17 */3 * * *' # a cada 3 horas
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-videos
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-videos.mjs
      - name: Commit se mudou
        run: |
          if git diff --quiet -- api/videos.json && git ls-files --error-unmatch api/videos.json >/dev/null 2>&1; then
            echo "Sem vídeos novos."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/videos.json
          git commit -m "Atualiza vídeos do canal"
          git push
